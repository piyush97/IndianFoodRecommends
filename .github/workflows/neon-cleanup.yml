name: Neon branch cleanup

# Each pull request may get a Neon branch of production (see ci.yml). Delete it when the PR closes,
# so free-tier branch slots are not used up. Skips quietly when the repository has no Neon secrets.
on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    # A fork's pull request has no access to secrets; that must not fail the run.
    continue-on-error: true
    steps:
      - name: Delete the PR's Neon branch
        if: env.NEON_API_KEY != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ env.NEON_API_KEY }}
