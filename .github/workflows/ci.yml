name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ifr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ifr
      # Throwaway service DB, so tests may truncate it.
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/ifr
      # Throwaway values for the E2E server (not secrets: CI-only, no real data).
      REPORT_SALT: ci-only-salt
      AUTH_SECRET: ci-only-auth-secret
      AUTH_TRUST_HOST: "true"
    steps:
      # The migration safety check needs history to know which migrations are new in this PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations, then the integration tests: they seed twice (idempotency)
      # and rely on the recommendation dedupe index.
      - run: node scripts/check-migrations.mjs origin/${{ github.base_ref || 'main' }}
      # Migrations run against this Postgres service on every PR, so a broken or
      # unsafe one fails here instead of at deploy time.
      - run: pnpm db:migrate
      - run: pnpm test
      # E2E on a freshly seeded DB (tests above truncate it).
      - run: pnpm e2e:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
