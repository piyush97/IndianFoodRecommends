name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are worthless; only cancel them on PRs, never on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default token scope; neither job needs write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ifr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ifr
      # Throwaway service DB, so tests may truncate it.
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/ifr
      # Throwaway values for the E2E server (not secrets: CI-only, no real data).
      REPORT_SALT: ci-only-salt
      AUTH_SECRET: ci-only-auth-secret
      AUTH_TRUST_HOST: "true"
    steps:
      # The migration safety check needs history to know which migrations are new in this PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Migrations, then the integration tests: they seed twice (idempotency)
      # and rely on the recommendation dedupe index.
      - run: node scripts/check-migrations.mjs origin/${{ github.base_ref || 'main' }}
      # Migrations run against this Postgres service on every PR, so a broken or
      # unsafe one fails here instead of at deploy time.
      - run: pnpm db:migrate
      # Same migrations against a Neon branch of production (real rows, real
      # extensions), so a NOT NULL or type change that only breaks on data fails here.
      # The branch is deleted when the PR closes (neon-cleanup.yml).
      # Compute presence without putting the key itself in the environment.
      - id: neon-key
        env:
          NEON_KEY_PRESENT: ${{ secrets.NEON_API_KEY != '' }}
        run: echo "has_key=$NEON_KEY_PRESENT" >> "$GITHUB_OUTPUT"
      - id: neon
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.neon-key.outputs.has_key == 'true'
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - if: steps.neon.outcome == 'success'
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
      - run: pnpm test
      # E2E on a freshly seeded DB (tests above truncate it).
      - run: pnpm e2e:seed
      - run: pnpm build
      # The runner image already has Chromium's system libraries; when Ubuntu's apt mirrors are
      # unreachable, `--with-deps` fails, so fall back to downloading only the browser.
      - run: pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
